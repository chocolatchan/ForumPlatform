        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Moderation]
      summary: Proactive moderation action without report (Moderator)
      operationId: applyProactiveModerationAction
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProactiveModerationActionRequest'
      responses:
        '200':
          description: Moderation action applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationAction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

