openapi: 3.1.0
info:
  title: Forum Platform Public API
  version: 1.1.0
  description: >
    Canonical OpenAPI 3.1 contract for the Forum Platform Public API Gateway.
    Reconciled in Task 002 with approved architecture decisions DEC-001 through DEC-005.
servers:
  - url: http://localhost:8000/api/v1
    description: Local API Gateway

tags:
  - name: Auth
    description: Authentication, session management, registration, and account recovery
  - name: Profile
    description: User profile and credential management
  - name: Admin Users
    description: User administration and role management
  - name: Categories
    description: Discussion categories
  - name: Threads
    description: Forum threads and lifecycle
  - name: Comments
    description: Hierarchical thread comments and replies
  - name: Uploads
    description: Attachment uploads and media handling
  - name: Interactions
    description: Votes, bookmarks, view tracking, and user reputation
  - name: Reports
    description: Abuse reports against threads, comments, and accounts
  - name: Moderation
    description: Moderation queue, report resolution, and audit logs
  - name: Notifications
    description: In-app notifications and preferences
  - name: Search
    description: Full-text search and query suggestions

paths:
  # ===========================================================================
  # AUTH & SESSION
  # ===========================================================================
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Get CSRF token
      operationId: getCsrfToken
      responses:
        '200':
          description: Synchronizer CSRF token returned
          content:
            application/json:
              schema:
                type: object
                required: [csrf_token]
                properties:
                  csrf_token:
                    type: string

  /auth/register:
    post:
      tags: [Auth]
      summary: Start registration and send OTP (DEC-001 neutral response)
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registration pending verification (Neutral response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPending'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/register/verify:
    post:
      tags: [Auth]
      summary: Verify registration OTP and create account
      operationId: verifyRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserPublic'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/register/resend-otp:
    post:
      tags: [Auth]
      summary: Resend registration OTP (DEC-001 neutral response)
      operationId: resendRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: OTP resent if eligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeutralAccepted'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and create browser session
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful, sets forum_session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
                example: forum_session=...; Path=/; HttpOnly; Secure; SameSite=Lax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      operationId: logout
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session revoked and cookie cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /auth/session:
    get:
      tags: [Auth]
      summary: Get current session and user
      operationId: getSession
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current authenticated user and session metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/recovery/request:
    post:
      tags: [Auth]
      summary: Request password recovery OTP (DEC-001 neutral response)
      operationId: requestPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '202':
          description: Recovery initiated if account exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeutralAccepted'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/recovery/verify:
    post:
      tags: [Auth]
      summary: Verify recovery OTP and issue short-lived reset token
      operationId: verifyPasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verified, reset token issued
          content:
            application/json:
              schema:
                type: object
                required: [reset_token, expires_at]
                properties:
                  reset_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/recovery/reset:
    post:
      tags: [Auth]
      summary: Reset password using reset token
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reset_token, new_password]
              properties:
                reset_token:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password reset successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===========================================================================
  # PROFILE & USERS
  # ===========================================================================
  /users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Profile]
      summary: Get public user profile
      operationId: getUserProfile
      responses:
        '200':
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublic'
        '404':
          $ref: '#/components/responses/NotFound'

  /profile:
    get:
      tags: [Profile]
      summary: Get own user profile
      operationId: getOwnProfile
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Own profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOwn'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      summary: Update editable profile fields
      operationId: updateProfile
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOwn'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/change-email/request:
    post:
      tags: [Profile]
      summary: Request email change
      operationId: requestEmailChange
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_email, password]
              properties:
                new_email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '202':
          description: Verification code sent to new email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NeutralAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /profile/change-email/verify:
    post:
      tags: [Profile]
      summary: Verify email change OTP
      operationId: verifyEmailChange
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '200':
          description: Email changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileOwn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profile/change-password:
    post:
      tags: [Profile]
      summary: Change password
      operationId: changePassword
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '204':
          description: Password changed, other sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /admin/users:
    get:
      tags: [Admin Users]
      summary: List and search users (Admin)
      operationId: adminListUsers
      security:
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
            enum: [member, moderator, admin]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAdminView'
                  next_cursor:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{user_id}/role:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin Users]
      summary: Change user role (Admin)
      operationId: adminChangeUserRole
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [member, moderator, admin]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # CATEGORIES
  # ===========================================================================
  /categories:
    get:
      tags: [Categories]
      summary: List active categories
      operationId: listCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      summary: Get category detail
      operationId: getCategory
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'

  /admin/categories:
    post:
      tags: [Categories]
      summary: Create category (Admin)
      operationId: adminCreateCategory
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                  maxLength: 80
                slug:
                  type: string
                  maxLength: 100
                description:
                  type: string
                sort_order:
                  type: integer
                  default: 0
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Categories]
      summary: Update category (Admin)
      operationId: adminUpdateCategory
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 80
                slug:
                  type: string
                  maxLength: 100
                description:
                  type: string
                sort_order:
                  type: integer
                is_hidden:
                  type: boolean
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # THREADS
  # ===========================================================================
  /threads:
    get:
      tags: [Threads]
      summary: List threads
      operationId: listThreads
      parameters:
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, most_viewed, most_voted]
            default: newest
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Thread page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThreadPage'
    post:
      tags: [Threads]
      summary: Create thread
      operationId: createThread
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Thread created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /threads/{thread_id}:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Threads]
      summary: Get thread detail
      operationId: getThread
      responses:
        '200':
          description: Thread detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Threads]
      summary: Edit own thread
      operationId: editThread
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 10
                  maxLength: 150
                body:
                  type: string
                  minLength: 20
                tags:
                  type: array
                  items:
                    type: string
                  maxItems: 5
      responses:
        '200':
          description: Thread updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Threads]
      summary: Delete own thread when policy permits
      operationId: deleteThread
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Thread deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /threads/{thread_id}/lock:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    put:
      tags: [Threads]
      summary: Lock or unlock thread (Moderator)
      operationId: setThreadLock
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_locked]
              properties:
                is_locked:
                  type: boolean
      responses:
        '200':
          description: Thread lock status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /threads/{thread_id}/pin:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    put:
      tags: [Threads]
      summary: Pin or unpin thread (Moderator)
      operationId: setThreadPin
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_pinned]
              properties:
                is_pinned:
                  type: boolean
      responses:
        '200':
          description: Thread pin status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /threads/{thread_id}/best-answer:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    put:
      tags: [Threads]
      summary: Set best answer for Q&A thread
      operationId: setBestAnswer
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment_id]
              properties:
                comment_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Best answer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # COMMENTS
  # ===========================================================================
  /threads/{thread_id}/comments:
    parameters:
      - $ref: '#/components/parameters/ThreadId'
    get:
      tags: [Comments]
      summary: List comments of a thread
      operationId: listThreadComments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Comment page
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  next_cursor:
                    type: string
                    nullable: true
    post:
      tags: [Comments]
      summary: Create comment or reply
      operationId: createComment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /comments/{comment_id}:
    parameters:
      - name: comment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Comments]
      summary: Edit own comment
      operationId: editComment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Comment edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Comments]
      summary: Delete comment
      operationId: deleteComment
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Comment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ===========================================================================
  # UPLOADS
  # ===========================================================================
  /uploads/images:
    post:
      tags: [Uploads]
      summary: Upload image attachment
      operationId: uploadImage
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File size exceeds 2 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported media type (JPG/PNG/WebP only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

