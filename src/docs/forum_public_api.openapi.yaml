              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string

# =============================================================================
# COMPONENTS
# =============================================================================
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: forum_session

  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
    ThreadId:
      name: thread_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string

  schemas:
    NeutralAccepted:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: accepted
        message:
          type: string
          example: If details are eligible, the request will be processed.

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          pattern: '^[A-Za-z0-9_]{3,32}$'
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8

    VerifyOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^[0-9]{6}$'

    RegistrationPending:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          example: pending_verification
        message:
          type: string
          example: If the registration details are eligible, a verification code has been sent.

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [user, session]
      properties:
        user:
          $ref: '#/components/schemas/UserPublic'
        session:
          type: object
          required: [idle_expires_at, absolute_expires_at]
          properties:
            idle_expires_at:
              type: string
              format: date-time
            absolute_expires_at:
              type: string
              format: date-time

    UserPublic:
      type: object
      required: [id, username, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        role:
          type: string
          enum: [member, moderator, admin]

    UserProfileOwn:
      type: object
      required: [id, username, email, role, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        bio:
          type: string
          nullable: true
        role:
          type: string
          enum: [member, moderator, admin]
        created_at:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 50
        bio:
          type: string
          maxLength: 200

    UserAdminView:
      type: object
      required: [id, username, email, role, is_banned, created_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [member, moderator, admin]
        is_banned:
          type: boolean
        ban_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    Category:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true

    Thread:
      type: object
      required: [id, author_id, category_id, title, body, status, is_pinned, is_locked, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, published, hidden, deleted]
        is_pinned:
          type: boolean
        is_locked:
          type: boolean
        best_answer_comment_id:
          type: string
          format: uuid
          nullable: true
        view_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ThreadPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Thread'
        next_cursor:
          type: string
          nullable: true

    CreateThreadRequest:
      type: object
      required: [category_id, title, body]
      properties:
        category_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 10
          maxLength: 150
        body:
          type: string
          minLength: 20
        tags:
          type: array
          items:
            type: string
          maxItems: 5
        image_ids:
          type: array
          items:
            type: string
            format: uuid

    CreateCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
        parent_comment_id:
          type: string
          format: uuid
          nullable: true

    Comment:
      type: object
      required: [id, thread_id, author_id, body, is_deleted, created_at]
      properties:
        id:
          type: string
          format: uuid
        thread_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        parent_comment_id:
          type: string
          format: uuid
          nullable: true
        body:
          type: string
        is_deleted:
          type: boolean
        created_at:
          type: string
          format: date-time

    Attachment:
      type: object
      required: [id, object_key, file_size, mime_type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        object_key:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        status:
          type: string
          enum: [pending, linked, orphaned, deleted]
        created_at:
          type: string
          format: date-time

    VoteRequest:
      type: object
      required: [value]
      properties:
        value:
          type: integer
          enum: [-1, 1]

    VoteResponse:
      type: object
      required: [target_type, target_id, my_vote, score]
      properties:
        target_type:
          type: string
          enum: [thread, comment]
        target_id:
          type: string
          format: uuid
        my_vote:
          type: integer
          nullable: true
        score:
          type: integer
        reputation_delta:
          type: integer

    CreateReportRequest:
      type: object
      required: [target_type, target_id, reason]
      properties:
        target_type:
          type: string
          enum: [thread, comment, account]
        target_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, abuse, harassment, wrong_category, misinformation, other]
        details:
          type: string
          maxLength: 1000

    Report:
      type: object
      required: [id, target_type, target_id, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [thread, comment, account]
        target_id:
          type: string
          format: uuid
        reason:
          type: string
          enum: [spam, abuse, harassment, wrong_category, misinformation, other]
        details:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewing, actioned, dismissed]
        resolution_note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    ModerationActionRequest:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [pin, lock, move_category, soft_delete, ban, unban, role_change, dismiss_report]
        reason:
          type: string
        metadata:
          type: object

    ProactiveModerationActionRequest:
      type: object
      required: [action, target_type, target_id, reason]
      properties:
        action:
          type: string
          enum: [pin, lock, move_category, soft_delete, ban, unban, role_change]
        target_type:
          type: string
          enum: [thread, comment, account]
        target_id:
          type: string
          format: uuid
        reason:
          type: string
        metadata:
          type: object

    ModerationAction:
      type: object
      required: [id, moderator_id, action, target_type, target_id, reason, created_at]
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
          nullable: true
        moderator_id:
          type: string
          format: uuid
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
          format: uuid
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    NotificationPreferences:
      type: object
      required: [in_app_enabled, email_enabled]
      properties:
        in_app_enabled:
          type: boolean
        email_enabled:
          type: boolean

    NotificationItem:
      type: object
      required: [id, type, title, body, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        body:
          type: string
        target_type:
          type: string
          nullable: true
        target_id:
          type: string
          format: uuid
          nullable: true
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationItem'
        next_cursor:
          type: string
          nullable: true

    SearchItem:
      type: object
      required: [thread_id, title, snippet, category_id, author_id, created_at]
      properties:
        thread_id:
          type: string
          format: uuid
        title:
          type: string
        snippet:
          type: string
        category_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    SearchPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
        next_cursor:
          type: string
          nullable: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field:
                    type: string
                  reason:
                    type: string
            request_id:
              type: string

  responses:
    BadRequest:
      description: Business rule or request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Request schema validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit or cooldown exceeded
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
